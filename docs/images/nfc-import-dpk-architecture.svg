<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nfc-import-setup-title nfc-import-setup-desc" id="nfc-import-setup-root">
        <title id="nfc-import-setup-title">以 NFC 交付 TAK 憑證：實驗設備部署</title>
        <desc id="nfc-import-setup-desc">Windows 主機上的 NTAG Reader 經 USB 讓 PN532 模擬 NFC 標籤，Android 手機讀到 tak 匯入連結後由 Tags 交給 ATAK，ATAK 經行動熱點從 share-public 下載憑證資料集並以 TLS 連上 tak-server。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #nfc-import-setup-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #nfc-import-setup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #nfc-import-setup-root .diagram-container { width: 100%; overflow-x: auto; }
      #nfc-import-setup-root .diagram-container { overflow-x: visible; }</style>
          <marker id="nfc-import-setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="nfc-import-setup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="nfc-import-setup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="40" y="40" width="400" height="436" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="56" y="32" width="92" height="16" fill="#f5f5f5"/>
        <text x="102" y="45" fill="#2d3142" fill-opacity="0.60" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Windows 主機</text>

        <rect x="480" y="40" width="176" height="168" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="496" y="32" width="64" height="16" fill="#f5f5f5"/>
        <text x="528" y="45" fill="#2d3142" fill-opacity="0.60" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">USB 周邊</text>

        <rect x="696" y="40" width="224" height="436" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="712" y="32" width="92" height="16" fill="#f5f5f5"/>
        <text x="758" y="45" fill="#2d3142" fill-opacity="0.60" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Android 手機</text>

        <!-- Network paths (behind nodes) -->
        <line x1="408" y1="130" x2="502" y2="130" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-link)"/>
        <line x1="632" y1="130" x2="718" y2="130" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-accent)"/>
        <line x1="808" y1="172" x2="808" y2="250" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow)"/>
        <path d="M 720,304 H 568 Q 560,304 560,296 V 278 Q 560,270 552,270 H 410" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-link)"/>
        <path d="M 720,356 H 608 Q 600,356 600,364 V 382 Q 600,390 592,390 H 410" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-link)"/>

        <!-- Path labels -->
        <rect x="420" y="110" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="119" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USB SERIAL</text>

        <rect x="640" y="110" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="119" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NFC · ISO-DEP</text>

        <rect x="816" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="848" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTION_VIEW</text>

        <rect x="448" y="250" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="259" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TLS:8089</text>

        <rect x="448" y="370" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="379" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP:10065</text>

        <!-- Node: NTAG Reader -->
        <rect x="72" y="88" width="336" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="88" width="336" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="96" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="94" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="240" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NTAG Reader</text>
        <rect x="80" y="140" width="320" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="88" y="156" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">emulate_ndef</text>
        <text x="392" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v0.1.0</text>

        <!-- Node: tak-server -->
        <rect x="72" y="228" width="336" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="228" width="336" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="236" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="94" y="245" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTR</text>
        <text x="240" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tak-server</text>
        <rect x="80" y="280" width="320" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="88" y="296" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">takserver (hardened)</text>
        <text x="392" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">5.8-RELEASE-92</text>

        <!-- Node: share-public -->
        <rect x="72" y="348" width="336" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="348" width="336" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="356" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="94" y="365" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTR</text>
        <text x="240" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">share-public</text>
        <text x="240" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/d/…/….dpk · 20 min · max 3</text>

        <!-- Node: PN532 (focal) -->
        <rect x="504" y="88" width="128" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="88" width="128" height="84" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="512" y="96" width="24" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="524" y="105" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HW</text>
        <text x="568" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PN532</text>
        <rect x="512" y="140" width="112" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="520" y="156" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">firmware</text>
        <text x="616" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.6</text>

        <!-- Node: Tags -->
        <rect x="720" y="88" width="176" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="88" width="176" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="96" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="742" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="808" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tags</text>
        <text x="808" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NDEF URI · 145 bytes</text>

        <!-- Node: ATAK -->
        <rect x="720" y="252" width="176" height="156" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="252" width="176" height="156" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="260" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="742" y="269" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="808" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ATAK-CIV</text>
        <text x="808" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tak://…/import?url=…</text>
        <text x="808" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cert/clientCert.p12</text>
        <text x="808" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config/servers.pref</text>
        <text x="808" y="388" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">takbox.local:8089:ssl</text>

        <!-- Annotation callout -->
        <text x="476" y="444" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif TC', serif">HTTP 與 TLS 都經過</text>
        <text x="476" y="464" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif TC', serif">Windows 行動熱點</text>

        <!-- Legend strip -->
        <line x1="40" y1="512" x2="920" y2="512" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="40" y="548" width="16" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="64" y="559" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">模擬標籤</text>

        <rect x="168" y="548" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="559" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">程式或容器</text>

        <line x1="320" y1="554" x2="348" y2="554" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-accent)"/>
        <text x="356" y="559" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">NFC 感應</text>

        <line x1="460" y1="554" x2="488" y2="554" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow-link)"/>
        <text x="496" y="559" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">跨區連線</text>

        <line x1="600" y1="554" x2="628" y2="554" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#nfc-import-setup-arrow)"/>
        <text x="636" y="559" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">區內交接</text>
      </svg>
