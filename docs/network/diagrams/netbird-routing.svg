<text x="465" y="280" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#1673ad" dominant-baseline="text-before-edge">NetBird tunnel</text>
<rect x="1129" y="245" width="177" height="76" fill="white"/>
<text x="1140" y="252" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#168069" dominant-baseline="text-before-edge">Host route /32</text>
<text x="1140" y="283" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#168069" dominant-baseline="text-before-edge">SNAT -&gt; VPC</text>
<rect x="1234" y="508" width="184" height="76" fill="white"/>
<text x="1245" y="515" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#168069" dominant-baseline="text-before-edge">Peer INPUT</text>
<text x="1245" y="546" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#168069" dominant-baseline="text-before-edge">No route SNAT</text>
<rect x="261" y="475" width="149" height="45" fill="white"/>
<text x="272" y="482" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#7151a5" dominant-baseline="text-before-edge">Private DNS</text>
<rect x="829" y="139" width="381" height="45" fill="white"/>
<text x="840" y="146" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#687788" dominant-baseline="text-before-edge">Existing public TAK entry retained</text>
<text x="50" y="945" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#17324a" dominant-baseline="text-before-edge">Solid: VPN data path | Dashed: DNS or preserved public entry | Return traffic follows each connection</text>
<text x="50" y="992" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Only one TAK host route is advertised. No full-VPC subnet route and no Internet exit node.</text>
<text x="50" y="1037" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">TCP 8446 is allowed by policy; the previous service probe was unreachable. Voice onboarding is separate.</text>
