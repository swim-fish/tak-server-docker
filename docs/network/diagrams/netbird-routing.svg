<text x="74" y="620" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">TAK -&gt; private TAK address</text>
<text x="74" y="656" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Media / Admin / Voice -&gt; Gateway</text>
<text x="74" y="692" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Admin answers: admin peers only</text>
<text x="74" y="728" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Public NetBird control unchanged</text>
<text x="74" y="764" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">No parent-domain override</text>
<rect x="540" y="570" width="660" height="310" rx="20" fill="#f5f9fc" stroke="#168069" stroke-width="3"/>
<text x="564" y="590" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#168069" dominant-baseline="text-before-edge">Identity at each boundary</text>
<text x="564" y="640" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">TAK: existing certificate identity + Gateway VPC source</text>
<text x="564" y="676" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Media: NetBird peer group + operation + exact path</text>
<text x="564" y="712" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">RTSP read: no password for approved peers and paths</text>
<text x="564" y="748" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Publish / protected read: credentials remain required</text>
<text x="564" y="784" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Voice: separate voice assignment + Mumble channel ACL</text>
