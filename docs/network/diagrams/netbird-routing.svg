<text x="1394" y="685" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Admin / media / Mumble</text>
<text x="1394" y="721" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Direct Gateway NetBird address</text>
<text x="1394" y="757" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Original peer source is visible</text>
<text x="1394" y="793" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Peer group + service auth</text>
<text x="1394" y="829" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Media isolation is enabled</text>
<rect x="50" y="550" width="390" height="270" rx="20" fill="#f5f9fc" stroke="#7151a5" stroke-width="3"/>
