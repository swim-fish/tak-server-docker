<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1740" viewBox="0 0 2300 1740" role="img">
<title>Network architecture | NetBird-integrated cloud deployment</title>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="38" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="46" font-weight="700" fill="#17324a" dominant-baseline="text-before-edge">Network architecture | NetBird-integrated cloud deployment</text>
<text x="60" y="103" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#486079" dominant-baseline="text-before-edge">Observed configuration: two VMs; public bootstrap, private service entry, and an unchanged public TAK path</text>
