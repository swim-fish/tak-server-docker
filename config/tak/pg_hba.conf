# Local socket access for the postgres operating-system account.
local   all             all                                     peer

# TAK Server is the only TCP database client and is isolated on tak-backend.
host    all             all             172.28.0.0/16           md5

# Explicit loopback access for health checks and local initialization.
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5
